version: 1
project: mdkit
environment: mp-lb
repository: mp-lb/mdkit
vercel:
  dnsZone: mp-lb.dev
  sites:
    docs:
      domain: mdkit.mp-lb.dev
      mode: new
      projectName: arcnet.mdkit.docs
      root: apps/docs
      build: [pnpm, --filter, "@mp-lb/mdkit-docs", build]
      output: apps/docs/build/client
      outputConfig:
        version: 3
        routes:
          - handle: filesystem
          - src: "/(.*)"
            dest: /__spa-fallback.html
variables:
  store: mp-lb/mp-lb
  paths:
    - /admin/standard-variables.json
secrets:
  sources:
    - key: ARCNET_STANDARD_SECRETS_KEY
      store: mp-lb/mp-lb
      path: /admin/standard-secrets.json.enc
  consumers:
    deploy:
      VERCEL_TOKEN: VERCEL_API_TOKEN
      CLOUDFLARE_API_TOKEN: CLOUDFLARE_API_TOKEN
    publish:
      NPM_TOKEN: NPM_TOKEN
      NODE_AUTH_TOKEN: NPM_TOKEN
      pnpm_config_//registry.npmjs.org/:_authToken: NPM_TOKEN
