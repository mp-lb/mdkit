project: mdkit
env-files:
  - .env.local
  - .env
homepage: http://localhost:${TESTBENCH_PORT}
ports:
  [
    DOCS_PORT,
    TESTBENCH_API_PORT,
    TESTBENCH_PORT,
  ]
links:
  - name: testbench
    url: http://localhost:${TESTBENCH_PORT}
  - name: testbench-api
    url: http://localhost:${TESTBENCH_API_PORT}/health
  - name: docs
    url: http://localhost:${DOCS_PORT}
native:
  testbench:
    aliases: [mdkit, tb]
    cmd: pnpm --filter=@mp-lb/mdkit-testbench dev
    env: "*"
    depends-on:
      - testbench-api
  testbench-api:
    aliases: [mdkit-api, tb-api]
    cmd: pnpm --filter=@mp-lb/mdkit-testbench-backend dev
    env: "*"
  docs:
    cmd: pnpm --filter=@mp-lb/mdkit docs:dev
    env: "*"
tasks:
  scripts:
    desc: Introduce this project
    cmds:
      - pnpm --dir packages/scripts exec tsx index.ts
  scripts-check:
    desc: Lint and typecheck project scripts
    cmds:
      - pnpm exec eslint packages/scripts
      - pnpm --dir packages/scripts run typecheck
  scripts-test:
    cmds:
      - pnpm --dir packages/scripts test
      - pnpm --dir packages/mdkit ci:scripts-test
  docs-gen:
    cmds:
      - pnpm --dir packages/mdkit exec tsx scripts/docsGen.ts
  docs-check:
    cmds:
      - pnpm --dir packages/mdkit exec tsx scripts/docsCheck.ts
  fix-esm-imports:
    cmds:
      - pnpm --dir packages/mdkit exec tsx scripts/addJsExtensions.ts
  publish-packages:
    cmds:
      - pnpm --dir packages/scripts exec tsx autoPublish.ts {{REST}}
  secrets-unlock:
    cmds:
      - dx decrypt --file docs/env.local.enc > .env
  secrets-lock:
    cmds:
      - dx encrypt --file .env > docs/env.local.enc
  secrets-check:
    cmds:
      - |
        dx decrypt --file docs/env.local.enc > /tmp/.env.check 2>/dev/null || { echo "no docs/env.local.enc"; exit 0; }
        if ! diff -q /tmp/.env.check .env >/dev/null 2>&1; then echo "WARN: .env differs from docs/env.local.enc - run: zap t secrets-lock"; rm -f /tmp/.env.check; exit 1; fi
        rm -f /tmp/.env.check; echo "secrets in sync"
  context-build:
    cmds:
      - npx -y @mp-lb/mdcompile context/index.md --optional --silent | fm compile --stdin -o AGENTS.md
      - npx -y @mp-lb/mdcompile context/index.md --optional --silent | fm compile --stdin -o CLAUDE.md
  lint:
    cmds:
      - pnpm lint
  check:
    cmds:
      - pnpm lint
      - pnpm turbo run typecheck
  build:
    cmds:
      - pnpm turbo run build
  vitest:
    cmds:
      - pnpm test
  worktree-setup:
    cmds:
      - pnpm install
      - grep -qxF '@AGENTS_WORKTREE.md' AGENTS.md || printf '\n@AGENTS_WORKTREE.md\n' >> AGENTS.md
